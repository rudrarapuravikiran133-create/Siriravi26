
<!DOCTYPE html>
<html>
<head>

    <title>siriravi Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;

            /* Background Photo */
            background-image:
                linear-gradient(
                    rgba(255, 105, 180, 0.75),
                    rgba(255, 105, 180, 0.75)
                ),
                url("ravi.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .login-box {
            background-color: rgba(255, 255, 255, 0.92);
            width: 350px;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: deeppink;
            margin-bottom: 10px;
        }

        h2 {
            color: hotpink;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid pink;
            border-radius: 8px;
            font-size: 16px;
        }

        .show-password {
            margin: 10px 5px;
        }

        button {
            background-color: hotpink;
            color: white;
            border: none;
            padding: 12px 35px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: deeppink;
        }

        #message {
            color: red;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h1>SiriRavi Rudra </h1>

        <h2>Login</h2>

        <input
            type="text"
            id="username"
            placeholder="Enter Username"
        >

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
        >

        <div>
            <input
                type="checkbox"
                id="showPassword"
                onclick="showPassword()"
            >

            <label for="showPassword">
                Show Password
            </label>
        </div>

        <br>

        <button onclick="login()">Login</button>

        <p id="message"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
