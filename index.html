<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Siri & Ravi</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
}

body {
    
    font-family: Arial, sans-serif;

    /* FULL PHOTO - NO CROPPING */
    background-image: url("RAVISIRI2009.jpg");

    background-position: center;
    
    width: 100%;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;
}


/* Login Card */
.login-box {
    width: 400px;
    padding: 42px 40px;

    background: rgba(255, 255, 255, 0.92);

    border: none;
    border-radius: 25px;

    box-shadow:
        0 15px 45px rgba(0, 0, 0, 0.25);

    text-align: center;
}

/* Heart */
.heart {
    font-size: 30px;
    color: #e91e73;
    margin-bottom: 8px;
}

/* Title */
.login-title {
    font-family: cursive;
    font-size: 38px;
    color: #d81b60;
    margin-bottom: 5px;
}

/* Login */
.subtitle {
    font-family: cursive;
    font-size: 25px;
    color: #e83e8c;
    margin-bottom: 30px;
}

/* Inputs */
.input-box {
    margin-bottom: 20px;
}

.input-box input {
    width: 100%;
    height: 52px;

    padding: 0 16px;

    font-size: 16px;

    border: 1px solid #f3b5cf;
    border-radius: 11px;

    outline: none;
    background: white;
}

.input-box input:focus {
    border-color: #e83e8c;
}

/* Show Password */
.show-password {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 8px;

    font-size: 16px;
    color: #333;

    margin-bottom: 25px;
}

.show-password input {
    width: 16px;
    height: 16px;
    accent-color: #e83e8c;
}

/* Button */
.login-btn {
    width: 130px;
    height: 48px;

    border: none;
    border-radius: 10px;

    background: #e83e8c;
    color: white;

    font-size: 17px;

    cursor: pointer;

    transition: 0.3s;
}

.login-btn:hover {
    background: #d81b60;
    transform: translateY(-2px);
}

/* Mobile */
@media (max-width: 600px) {

    .login-box {
        width: 90%;
        padding: 35px 25px;
    }

    .login-title {
        font-size: 32px;
    }

    .subtitle {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<div class="login-box">

    <div class="heart">♥</div>

    <h1 class="login-title">
        Siri & Ravi
    </h1>

    <div class="subtitle">
        Login
    </div>

    <div class="input-box">
        <input
            type="text"
            id="username"
            placeholder="Enter Username"
        >
    </div>

    <div class="input-box">
        <input
            type="password"
            id="password"
            placeholder="Enter Password"
        >
    </div>

    <label class="show-password">
        <input type="checkbox" id="showPassword">
        Show Password
    </label>

    <button class="login-btn" onclick="login()">
        Login
    </button>

</div>

<script>

document.getElementById("showPassword")
.addEventListener("change", function () {

    const password =
        document.getElementById("password");

    password.type = this.checked
        ? "text"
        : "password";
});


function login() {

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    if (username === "" || password === "") {

        alert("Please enter username and password.");
        return;
    }

    if (username === "siriravi" && password === "261125") {

        window.location.href = "home.html";

    } else {

        alert("Invalid username or password.");
    }
}

</script>

</body>
</html>
